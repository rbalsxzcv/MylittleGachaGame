<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: 노치/둥근 모서리 영역까지 사용하고 safe-area로 여백 처리 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14122b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tiny Gacha">
  <meta name="description" content="작은 캐릭터 수집 가챠 게임 (비상업 팬메이드 프로젝트)">
  <title>Tiny Gacha</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 화면 전체 (safe-area 여백 포함) -->
  <div id="viewport">
    <!-- 1280x720 고정 논리 화면. JS가 화면에 맞게 확대/축소 -->
    <div id="stage">
      <div id="screen-layer"></div>
      <header id="hud" data-mode="none"></header>
      <div id="modal-layer"></div>
      <div id="toast-layer" aria-live="polite"></div>
      <div id="boot-screen">불러오는 중…</div>
    </div>
  </div>

  <!-- 세로 화면 안내 (CSS 미디어쿼리로 표시) -->
  <div id="rotate-overlay" role="alert">
    <div class="rotate-phone" aria-hidden="true"><i></i></div>
    <p>기기를 가로로 돌려주세요</p>
  </div>

  <noscript><p class="noscript">이 게임은 JavaScript가 필요해요.</p></noscript>

  <!-- index.html을 더블클릭해서(file://) 열면 브라우저가 모듈/JSON 불러오기를 막음 → 해결 방법 안내 -->
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var box = document.createElement('div');
        box.className = 'file-warning';
        box.innerHTML =
          '<h1>로컬 서버로 열어 주세요</h1>' +
          '<p>index.html을 직접 열면(file://) 브라우저 보안 때문에 게임 파일을 불러올 수 없어요.</p>' +
          '<ol>' +
          '<li>저장소 폴더의 <b>게임실행.bat</b>을 더블클릭하세요. 서버가 켜지고 게임이 열려요.</li>' +
          '<li>또는 VS Code에서 index.html을 우클릭하고 <b>Open with Live Server</b>를 누르세요.</li>' +
          '<li>또는 터미널에서 <code>python -m http.server 8000</code>을 실행한 뒤 <b>http://localhost:8000</b>을 여세요.</li>' +
          '</ol>' +
          '<p class="small">GitHub Pages에 올린 주소(https://)에서는 바로 동작해요.</p>';
        document.body.appendChild(box);
      });
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
