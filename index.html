<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: 노치/둥근 모서리 영역까지 사용하고 safe-area로 여백 처리 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1c130d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tiny Gacha">
  <meta name="description" content="작은 캐릭터 수집 가챠 게임 (비상업 팬메이드 프로젝트)">
  <title>Tiny Gacha</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 화면 전체 (safe-area 여백 포함) -->
  <div id="viewport">
    <!-- 1280x720 고정 논리 화면. JS가 화면에 맞게 확대/축소 -->
    <div id="stage">
      <div id="screen-layer"></div>
      <header id="hud" data-mode="none"></header>
      <div id="modal-layer"></div>
      <div id="toast-layer" aria-live="polite"></div>
      <div id="boot-screen">불러오는 중…</div>
    </div>
  </div>

  <!-- 세로 화면 안내 (CSS 미디어쿼리로 표시) -->
  <div id="rotate-overlay" role="alert">
    <div class="rotate-phone" aria-hidden="true"><i></i></div>
    <p>기기를 가로로 돌려주세요</p><br>
    <p>설정에서 전체화면 모드로 전환하면 쾌적한 플레이가 가능합니다.</p>
  </div>

  <noscript><p class="noscript">이 게임은 JavaScript가 필요해요.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
